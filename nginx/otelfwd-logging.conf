# otelfwd-logging.conf - NGINX logging snippet for otelfwd (Log Forwarder for OpenTelemetry)
#
# Include this file inside the http { } context:
#
#     http {
#         include /etc/nginx/otelfwd-logging.conf;
#         ...
#     }
#
# The forwarder receives this on its syslog input (OTELFWD_SYSLOG_SOCKET). Set the socket path below to that path
# and give the NGINX worker processes write permission on it (OTELFWD_SYSLOG_SOCKET_MODE).

# JSON access log format.
#
# Keys are named after OpenTelemetry attribute names, so the forwarder needs almost
# no field mapping. Notes on individual fields:
#
#   time                          quoted string "seconds.millis" ($msec) - exact parsing,
#                                 $time_iso8601 only has second resolution
#   url.path                      $uri is the normalized path without query string.
#                                 $request_uri would include the query string, which can
#                                 carry tokens - do not log it unless you need it
#   nginx.upstream.response_time  quoted, empty without an upstream (the forwarder skips empty strings),
#                                 can be "-" or a comma separated list when NGINX retries an upstream
#   url.scheme, http.request.size http or https, and the size of the request line, headers and body in bytes
#   ports                         $server_port and $remote_port are not logged: they are empty for
#                                 clients on a UNIX socket and would break the JSON
#   numeric variables             $status, $request_length, $body_bytes_sent and $request_time are always
#                                 numbers, so they are not quoted

log_format otelfwd_json escape=json
  '{"time":"$msec"'
  ',"server.address":"$host"'
  ',"client.address":"$remote_addr"'
  ',"http.request.method":"$request_method"'
  ',"url.scheme":"$scheme"'
  ',"url.path":"$uri"'
  ',"http.response.status_code":$status'
  ',"http.request.size":$request_length'
  ',"http.response.body.size":$body_bytes_sent'
  ',"user_agent.original":"$http_user_agent"'
  ',"nginx.request_time":$request_time'
  ',"nginx.upstream.response_time":"$upstream_response_time"'
  ',"nginx.request_id":"$request_id"}';


# Send logs to the forwarder via syslog.
#
# * NGINX can only send syslog over UDP or a UNIX datagram socket (no TCP).
# * Access and error log share one socket. The tag selects the decoder in the forwarder.
# * The NGINX worker user needs write permission on the socket file
#   (and search permission on its directory), or NGINX cannot log to it.
# * The severity of error_log messages is set by NGINX itself
#   (the severity= parameter is ignored for error_log).
# * nohostname keeps the syslog header small; the forwarder knows its own hostname.

access_log syslog:server=unix:/run/otelfwd/syslog.sock,tag=nginx_access,severity=info,nohostname otelfwd_json;
error_log  syslog:server=unix:/run/otelfwd/syslog.sock,tag=nginx_error,nohostname warn;


# Parallel plain files - useful to compare with what arrives via syslog
# and to provide sample data for testing the forwarder. Remove for production.

access_log /var/log/nginx/access_test.log otelfwd_json;
error_log  /var/log/nginx/error_test.log warn;
